# lazyfinder as a herdr plugin: a lazyfinder sidebar docked at the left or right edge of every tab, in the sidebar
# mode, following the folder of the pane next to it. Install: herdr plugin install MathiasDrizzy/lazyfinder
# Settings (config.json of lazyfinder, or its Settings popup): the herdr section, see docs/configuration.md.

id = "lazyfinder"
name = "lazyfinder"
version = "0.16.4"
description = "Finder-like file manager as a herdr sidebar that follows the folder of the pane next to it."
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]

# Builds bin/lazyfinder with Go, or links the lazyfinder already installed.
[[build]]
command = ["/bin/sh", "scripts/herdr-build.sh"]

# The title is how the plugin tells its pane from the others (herdr.Label).
[[panes]]
id = "sidebar"
title = "lazyfinder"
placement = "split"
command = ["./bin/lazyfinder", "--sidebar"]

[[actions]]
id = "toggle"
title = "Toggle lazyfinder"
description = "Open the lazyfinder sidebar at its edge; focus it if it is open; close it if it has the focus."
command = ["./bin/lazyfinder", "--herdr", "toggle"]

# Once herdr restored its session after a restart, the sidebars it brought back as shells are lazyfinder again.
[[startup]]
command = ["./bin/lazyfinder", "--herdr", "startup"]

# Each hook docks a sidebar in its tab when it has none (idempotent, never takes the focus). A sidebar closed with
# the toggle stays closed in that tab.
[[events]]
on = "tab.created"
command = ["./bin/lazyfinder", "--herdr", "ensure"]

[[events]]
on = "workspace.created"
command = ["./bin/lazyfinder", "--herdr", "ensure"]

[[events]]
on = "tab.focused"
command = ["./bin/lazyfinder", "--herdr", "ensure"]

[[events]]
on = "workspace.focused"
command = ["./bin/lazyfinder", "--herdr", "ensure"]

[[events]]
on = "pane.focused"
command = ["./bin/lazyfinder", "--herdr", "ensure"]

# When the program of a tab lazyfinder opened quits, that tab is left with its sidebar only: the hook closes it.
[[events]]
on = "pane.exited"
command = ["./bin/lazyfinder", "--herdr", "ensure"]

[[events]]
on = "pane.closed"
command = ["./bin/lazyfinder", "--herdr", "ensure"]
