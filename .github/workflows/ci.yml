name: CI

# Linux only: a macOS runner costs ten Linux minutes, so macOS runs in ci-macos.yml before a release (the push of a
# v* tag) and by hand, and .claude/harness/verificar.sh runs the same tests on macOS before each push. Changes that
# touch only documentation run no CI. See docs/adr/0016-ci-minutes.md.
on:
  push:
    branches: [ main, 'ci/**' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/readme/**'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/readme/**'
      - 'LICENSE'
  workflow_dispatch:

# CI only reads the repository
permissions:
  contents: read

# a newer push to the same branch cancels the run of the older one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet + test -race (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race -count=1 ./...

  cross-build:
    name: build darwin/linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: GOOS build
        run: for os in darwin linux; do GOOS=$os go build ./... ; done

  lint-vuln:
    name: golangci-lint + govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  release-dry-run:
    name: release dry run (snapshot, not published)
    # Only on the disposable ci/** branches: exercises release.yml without a tag.
    if: startsWith(github.ref, 'refs/heads/ci/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # same as release.yml, so the attestation step is exercised too
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Release notes (newest released section, or the unreleased one before 0.1.0)
        run: |
          version="$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ' || true)"
          scripts/release-notes.sh "${version:-Unreleased}" > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2 # keep equal to release.yml
          args: release --snapshot --clean --skip=publish --release-notes ${{ runner.temp }}/release-notes.md
      - name: Build provenance for the archives and the SBOMs
        # GitHub does not offer attestations for user-owned private repositories (it fails with "Feature not available"),
        # so the step runs once the repository is public
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: List the artifacts
        run: ls -1 dist | grep -E '\.(tar\.gz|zip)$|checksums' | sort
