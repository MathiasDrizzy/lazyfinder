name: CI macOS

# A macOS runner costs ten Linux minutes, so the macOS tests run only before a release (the push of a v* tag, next to
# release.yml) and by hand; the maintainer runs them on a Mac before each push, and ci.yml runs Linux.
# See docs/adr/0016-ci-minutes.md.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

# CI only reads the repository
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet + test -race (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a tag build does not read a cache other runs could have written
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race -count=1 ./...
