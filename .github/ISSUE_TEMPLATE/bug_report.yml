name: Bug report
description: Something does not work as the README or the help says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For a security problem, do not open an issue; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. lazyfinder ~/some/folder
        2. Press …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `lazyfinder --version`.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and terminal
      placeholder: macOS 26, Ghostty 1.2
    validations:
      required: true
