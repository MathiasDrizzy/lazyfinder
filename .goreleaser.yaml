# GoReleaser v2. Docs: https://goreleaser.com/customization/
version: 2

project_name: lazyfinder

builds:
  - id: lazyfinder
    main: ./cmd/lazyfinder
    binary: lazyfinder
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*
      - docs/lazyfinder.1

checksum:
  name_template: "checksums.txt"

sboms:
  - id: archive
    artifacts: archive # one SPDX JSON per archive, made by syft

signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]
    signature: "${artifact}.sigstore.json"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"
