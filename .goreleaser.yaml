# GoReleaser v2. Docs: https://goreleaser.com/customization/
version: 2

project_name: lazyfinder

builds:
  - id: lazyfinder
    main: ./cmd/lazyfinder
    binary: lazyfinder
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*
      - docs/lazyfinder.1

checksum:
  name_template: "checksums.txt"

homebrew_casks:
  - name: lazyfinder
    repository:
      owner: MathiasDrizzy
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/MathiasDrizzy/lazyfinder"
    description: "Finder-like file manager for the terminal"
    binaries:
      - lazyfinder
    # brew install does not touch the shell's startup file: without this line, quitting does not change folder
    caveats: |
      To stay in the folder lazyfinder ends in when you quit, add one line to your shell's startup file:
        zsh  (~/.zshrc):                    eval "$(lazyfinder --shell-init zsh)"
        bash (~/.bashrc):                   eval "$(lazyfinder --shell-init bash)"
        fish (~/.config/fish/config.fish):  lazyfinder --shell-init fish | source
      Then open a new terminal.
    # The binary is not signed or notarized: remove the macOS quarantine, the same hook as the lazymark cask.
    # Homebrew warns "postflight is deprecated! Use postflight_steps instead" for it. GoReleaser does not write
    # postflight_steps yet (hooks.post.install_steps, goreleaser/goreleaser#6873, planned for v2.19.0); when it does,
    # switch to install_steps with: on_macos do run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine",
    # "{{ .StagedPath }}/lazyfinder"] end.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/lazyfinder"]
          end

sboms:
  - id: archive
    artifacts: archive # one SPDX JSON per archive, made by syft

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"
